# $ systemctl --user restart pipewire && sleep 0.8 && cvlc test.mp3 --start-time=46 # --stop-time=49

# get the device names from $ wpctl status
# then get the names using ids from $ pw-cli ls Node

context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Headphones EQ"
            media.name       = "Headphones EQ"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq
                        label = param_eq
                        config = {
                            filters = [
                                # q: narrowness
                                { type = bq_highshelf, freq = 0, gain = -8.0, q = 1.0 },
                                { type = bq_peaking, freq = 62, gain = 8, q = 0.6 },
                                { type = bq_peaking, freq = 120, gain = 1, q = 0.5 },
                                { type = bq_peaking, freq = 2000, gain = -3.0, q = 0.3 },
                                { type = bq_highshelf, freq = 5000, gain = -8.0, q = 0.3 },
                                { type = bq_highshelf, freq = 7000, gain = -9.0, q = 0.5 },
                            ]
                        }
                    }
                ]
                links = []
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.headphones.eq"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = headphones.eq
                filter.smart.target = { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Headphones__sink" }
            }
            playback.props = {
                node.name   = "headphones.eq"
                node.passive = true
            }
        }
    },
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers EQ"
            media.name       = "Speakers EQ"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq
                        label = param_eq
                        config = {
                            filters = [
                                { type = bq_highshelf, freq = 0, gain = -40.0, q = 10.0 },
                                { type = bq_peaking, freq = 63, gain = 40, q = 0.1 },
                                # { type = bq_peaking, freq = 152, gain = 10, q = 0.5 },
                                { type = bq_highshelf, freq = 3000, gain = -2.0, q = 0.3 },
                            ]
                        }
                    }
                ]
                links = []
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.speakers.eq"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = speakers.eq
                filter.smart.target = { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name   = "speakers.eq"
                node.passive = true
            }
        }
    }
]
